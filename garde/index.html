<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0D372E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-192.png">
<script src="../config.js"></script>
<title>Rivio · Garde-pêche</title>
<link rel="icon" href="../logo-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --paper:#EAF0EB; --card:#FFFFFF; --ink:#13342B; --ink2:#55695F; --ink3:#7E9188;
  --water:#2C8B73; --water-d:#1C6654; --deep:#0D372E; --deep2:#14463B;
  --fish:#E07A22; --fish-l:#FBE8D3; --hook:#F4EBDA;
  --rust:#B2432E; --rust-l:#F6DFD8; --line:#D6E0D9; --line2:#E6ECE7; --sky:#F5F8F5;
  --r1:6px; --r2:12px;
  --hover:#f4f8f5; --chart-bg:#f5f8f5; --gauge:#ffffff;
  --f-d:"Barlow Condensed","Arial Narrow",sans-serif; --f-b:"Source Sans 3",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--f-b);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--fish);outline-offset:2px}
a{color:var(--water-d)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Connexion ---------- */
#login{position:fixed;inset:0;display:grid;grid-template-columns:1.1fr 1fr;background:var(--deep)}
#login .scene{position:relative;overflow:hidden;background:linear-gradient(180deg,#123f34 0%,#0d372e 55%,#0a2b24 100%)}
#login .scene svg{position:absolute;inset:auto 0 0 0;width:100%;height:62%}
#login .brand{position:absolute;left:56px;top:52px;display:flex;align-items:center;gap:16px;color:var(--hook)}
#login .brand img{width:56px;height:56px;border-radius:14px}
#login .brand b{font:700 40px/1 var(--f-d);letter-spacing:.01em}
#login .brand span{display:block;font:500 20px/1.1 var(--f-d);color:#9fc3b6}
#login .motto{position:absolute;left:56px;top:190px;max-width:420px;font:600 54px/0.98 var(--f-d);color:#fff}
#login .motto em{font-style:normal;color:var(--fish)}
#login form{align-self:center;justify-self:center;width:min(380px,86%);background:var(--card);border-radius:var(--r2);padding:34px 32px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
#login h1{font:600 30px/1 var(--f-d);margin:0 0 6px}
#login p.hint{margin:0 0 22px;color:var(--ink2)}
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-weight:600;font-size:13.5px;margin-bottom:5px;color:var(--ink2)}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:var(--r1);padding:10px 12px;background:var(--card)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--water);outline:none;box-shadow:0 0 0 3px rgba(44,139,115,.18)}
.err{color:var(--rust);font-weight:600;min-height:20px;margin:4px 0 10px}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r1);padding:7px 13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--water);color:var(--water-d)}
.btn.primary{background:var(--water);border-color:var(--water);color:#fff}
.btn.primary:hover{background:var(--water-d);border-color:var(--water-d);color:#fff}
.btn.warn{background:var(--fish);border-color:var(--fish);color:#fff}
.btn.danger{color:var(--rust);border-color:#e9c3b9}
.btn.danger:hover{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.sm{padding:4px 10px;font-size:13.5px}
.btn.wide{width:100%;justify-content:center;padding:11px}
.btn,a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:#fff}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{background:none;border:0;padding:0;color:var(--water-d);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- Structure ---------- */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
#side{background:var(--deep);color:var(--hook);position:sticky;top:0;height:100vh;align-self:start;display:flex;flex-direction:column;padding:22px 14px}
#side .brand{display:flex;align-items:center;gap:11px;padding:0 8px 26px}
#side .brand img{width:40px;height:40px;border-radius:10px}
#side .brand b{display:block;font:700 26px/0.9 var(--f-d);color:#fff}
#side .brand span{font:500 16px/1 var(--f-d);color:#9fc3b6}
#side nav{display:flex;flex-direction:column;gap:2px}
#side nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:#cfe0d8;text-decoration:none;font-weight:600}
#side nav a svg{width:19px;height:19px;flex:none;opacity:.8}
#side nav a:hover{background:var(--deep2);color:#fff}
#side nav a.on{background:var(--hook);color:var(--deep)}
#side nav a.on svg{opacity:1}
#side nav a .badge{margin-left:auto}
#side .foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid #23574a;font-size:13.5px;color:#9fc3b6}
#side .foot b{color:#fff}
#side .foot .link{color:#cfe0d8;font-size:13.5px;text-align:left}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--fish);color:#fff;font:700 12.5px/1 var(--f-b)}
.badge.calm{background:var(--line);color:var(--ink2)}
main{padding:30px 40px 60px;min-width:0}
.top{display:flex;align-items:flex-end;gap:20px;margin-bottom:22px}
.top h1{font:600 42px/0.95 var(--f-d);margin:0;letter-spacing:.005em}
.top p{margin:6px 0 0;color:var(--ink2)}
.top .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.search{position:relative}
.search input{width:280px;border:1.5px solid var(--line);border-radius:20px;padding:8px 14px 8px 36px;background:var(--card)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink3)}
.demo-tag{background:var(--fish-l);color:#8a4a12;border-radius:6px;padding:4px 10px;font-weight:600;font-size:13px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:20px 22px}
.panel h2{font:600 24px/1 var(--f-d);margin:0 0 4px}
.panel .sub{color:var(--ink2);margin:0 0 14px;font-size:14px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-top:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px}
@media (max-width:1180px){.grid2,.grid3{grid-template-columns:1fr}}

/* ---------- Échelle de la rivière (signature) ---------- */
.river{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.river .head{position:absolute;left:96px;top:20px;right:24px;display:flex;align-items:flex-start;gap:28px;pointer-events:none}
.river .lvl b{display:block;font:700 64px/0.85 var(--f-d);color:var(--deep)}
.river .lvl span{display:block;color:var(--ink2);font-weight:600;margin-top:6px}
.river .facts{display:flex;gap:26px;margin-left:auto;text-align:right}
.river .facts b{display:block;font:600 30px/1 var(--f-d)}
.river .facts span{color:var(--ink2);font-size:13.5px}
.river svg{display:block;width:100%;height:300px}

/* ---------- Listes « à traiter » ---------- */
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--line2)}
.todo li:first-child{border-top:0}
.todo .n{font:700 30px/1 var(--f-d);min-width:44px;text-align:right}
.todo .n.hot{color:var(--fish)}
.todo .n.zero{color:var(--ink3)}
.todo .t b{display:block}
.todo .t span{color:var(--ink2);font-size:13.5px}
.todo .btn{margin-left:auto}

.health{list-style:none;margin:0;padding:0}
.health li{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line2)}
.health li:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--water)}
.dot.bad{background:var(--rust)} .dot.mid{background:var(--fish)} .dot.off{background:var(--ink3)}
.health small{color:var(--ink2)}

/* ---------- Tableaux ---------- */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:3px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:18px;font-weight:600;color:var(--ink2);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.seg button.on{background:var(--deep);color:#fff}
.seg button .badge{height:19px;min-width:19px;font-size:11.5px}
table.t{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
table.t th{text-align:left;font-weight:600;font-size:13px;color:var(--ink2);background:var(--sky);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover td{background:var(--hover)}
table.t td.r,table.t th.r{text-align:right}
.who{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 15px/1 var(--f-d);color:#fff;background:var(--water);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.who b{display:block}
.who small{color:var(--ink2)}
.tag{display:inline-block;border-radius:5px;padding:1px 7px;font-size:12.5px;font-weight:600;background:var(--line2);color:var(--ink2);margin:1px 4px 1px 0;white-space:nowrap}
.tag.admin{background:var(--deep);color:#fff}
.tag.ctrl{background:#e2ddf6;color:#4b3d8f}
.tag.owner{background:var(--hook);color:#7a5a1d}
.tag.mod{background:#dcefe8;color:var(--water-d)}
.tag.pending{background:var(--fish-l);color:#8a4a12}
.tag.ban{background:var(--rust-l);color:var(--rust)}
.muted{color:var(--ink3)}
.empty{padding:34px;text-align:center;color:var(--ink2);background:var(--card);border:1px dashed var(--line);border-radius:var(--r2)}

/* ---------- Cartes de signalement / modération ---------- */
.cards{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:8px 18px}
.card .what{font-weight:600}
.card .meta{color:var(--ink2);font-size:13.5px}
.card blockquote{grid-column:1/-1;margin:2px 0;padding:10px 14px;background:var(--sky);border-left:3px solid var(--fish);border-radius:4px;white-space:pre-wrap}
.card .acts{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.card img.ph{grid-column:1/-1;max-height:220px;border-radius:8px;object-fit:cover}

/* ---------- Galerie des prises ---------- */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.shot{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;display:flex;flex-direction:column}
.shot .img{aspect-ratio:4/3;background:linear-gradient(160deg,#cfe1d8,#9cc0b2);display:grid;place-items:center;color:#fff;font:600 22px var(--f-d)}
.shot .img img{width:100%;height:100%;object-fit:cover;display:block}
.shot .b{padding:10px 12px;display:grid;gap:2px}
.shot .b b{font:600 19px/1.05 var(--f-d)}
.shot .b small{color:var(--ink2)}
.shot .b .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}

/* ---------- Tiroir membre ---------- */
#drawer{position:fixed;inset:0;display:none;z-index:20}
#drawer.open{display:block}
#drawer .back{position:absolute;inset:0;background:rgba(13,55,46,.35)}
#drawer .sheet{position:absolute;top:0;right:0;bottom:0;width:min(520px,94vw);background:var(--paper);overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.2);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#drawer .sheet{animation:none}}
.dh{background:var(--deep);color:#fff;padding:26px 26px 22px;position:relative}
.dh .av{width:64px;height:64px;font-size:28px;border:3px solid var(--hook)}
.dh h2{font:600 34px/1 var(--f-d);margin:12px 0 4px}
.dh p{margin:0;color:#b9d3c9}
.dh .x{position:absolute;right:16px;top:14px;background:none;border:0;color:#fff;font-size:26px;cursor:pointer;line-height:1}
.db{padding:20px 26px;display:grid;gap:16px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:7px 12px;font-size:14.5px}
.kv dt{color:var(--ink2)} .kv dd{margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.stats b{display:block;font:700 26px/1 var(--f-d)}
.stats span{font-size:12.5px;color:var(--ink2)}
.hist{list-style:none;margin:0;padding:0;font-size:14px}
.hist li{padding:7px 0;border-top:1px solid var(--line2)} .hist li:first-child{border-top:0}
.hist time{color:var(--ink2);margin-right:8px}

/* ---------- Boîte de dialogue ---------- */
dialog{border:0;border-radius:var(--r2);padding:0;width:min(460px,92vw);box-shadow:0 30px 80px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(13,55,46,.45)}
dialog form{padding:24px}
dialog h3{font:600 26px/1 var(--f-d);margin:0 0 8px}
dialog p{margin:0 0 16px;color:var(--ink2)}
dialog .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}


/* ---------- Thème sombre ---------- */
:root{ --s-blue:#2a78d6; --s-orange:#eb6834; --s-aqua:#1baf7a; --s-yellow:#eda100; --s-magenta:#e87ba4; --s-violet:#6250d6; --s-other:#a3b1aa;
  --sky-top:#FFD9B5; --sky-mid:#FCEBDD; --sky-bot:#E3F1F2; --water-1:#1baf7a; --water-2:#2a78d6; --water-3:#1d4e8f; --sun:#F6A04D; }
:root[data-theme="dark"]{ --s-blue:#3987e5; --s-orange:#d95926; --s-aqua:#199e70; --s-yellow:#c98500; --s-magenta:#d55181; --s-violet:#9085e9; --s-other:#5d7169;
  --sky-top:#3A2A3F; --sky-mid:#1E2F3A; --sky-bot:#13302B; --water-1:#199e70; --water-2:#3987e5; --water-3:#173b6b; --sun:#D9792E; }
:root[data-theme="dark"]{
  --paper:#0B1D18; --card:#122A23; --ink:#E4EEE8; --ink2:#A9BDB4; --ink3:#7F968C;
  --water:#3BA88B; --water-d:#7FD0B8; --deep:#071612; --deep2:#0F2A23;
  --fish:#EE8A35; --fish-l:#3A2614; --hook:#F4EBDA;
  --rust:#E06A52; --rust-l:#3A1E18; --line:#244238; --line2:#1B362E; --sky:#0F241E;
  --hover:#173229; --chart-bg:#0F241E; --gauge:#183329;
  color-scheme:dark;
}
:root[data-theme="dark"] .tag.admin{background:var(--hook);color:var(--deep)}
:root[data-theme="dark"] .tag.ctrl{background:#2C2650;color:#C9BFF5}
:root[data-theme="dark"] .tag.owner{background:#3A3018;color:#E9CF8F}
:root[data-theme="dark"] .tag.mod{background:#183A30;color:#8FDCC4}
:root[data-theme="dark"] .tag.pending{color:#F2B47E}
:root[data-theme="dark"] .demo-tag{color:#F2B47E}
:root[data-theme="dark"] .river .lvl b{color:#fff}
:root[data-theme="dark"] .btn.primary{color:#06231C}
:root[data-theme="dark"] .btn.primary:hover{color:#06231C;background:var(--water-d);border-color:var(--water-d)}
dialog{background:var(--card);color:var(--ink)}
.dark-toggle{display:flex;align-items:center;gap:8px;margin-top:8px}

/* ---------- Indicateurs ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px}
.kpi b{display:block;font:700 40px/0.95 var(--f-d)}
.kpi span{color:var(--ink2);font-size:13.5px}
.kpi small{display:block;color:var(--ink3);font-size:12.5px;margin-top:4px}
.kpi.accent{border-color:var(--water);box-shadow:inset 4px 0 0 var(--water)}
.cols{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.cols .c i{display:block;width:100%;background:var(--water);border-radius:4px 4px 0 0;min-height:2px}
.cols .c i.net{background:var(--water-d)}
.cols .c .pair{display:flex;gap:2px;align-items:flex-end;width:100%;height:150px}
.cols .c .pair i{flex:1}
.cols .c small{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.cols .c em{font-style:normal;font-size:11.5px;color:var(--ink2)}
.hbar{display:grid;grid-template-columns:160px 1fr 60px;gap:10px;align-items:center;padding:5px 0}
.hbar .bar{height:12px}
.hbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.heat td.v{text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.legend{display:flex;gap:16px;color:var(--ink2);font-size:13px;margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.steps{margin:0;padding-left:20px} .steps li{margin:6px 0}
.notice{background:var(--fish-l);border:1px solid #f0c9a2;border-radius:var(--r2);padding:14px 18px;margin-bottom:18px}
:root[data-theme="dark"] .notice{border-color:#5a3a1c}
.notice b{display:block;margin-bottom:4px}

/* ---------- Annonces ---------- */
.ann-preview{border-radius:10px;padding:12px 14px;background:var(--deep);color:#fff;display:flex;gap:10px;align-items:flex-start}
.ann-preview b{display:block}
.ann-preview span{color:#cfe0d8;font-size:14px}
.ann-preview.important{background:#7a3418} .ann-preview.nouveau{background:#1c6654} .ann-preview.maintenance{background:#4a4a2a}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:8px;align-items:center;font-weight:600;margin:4px 0 12px}

/* ---------- Recherche ---------- */
.side-search{margin:0 4px 18px;position:relative}
.side-search input{width:100%;border:1px solid #2b5e51;background:var(--deep2);color:#fff;border-radius:8px;padding:8px 10px 8px 32px}
.side-search input::placeholder{color:#8fb3a6}
.side-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:#8fb3a6}
mark{background:#fde7b0;color:inherit;border-radius:2px;padding:0 1px}
:root[data-theme="dark"] mark{background:#6b5216}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumbs .th{aspect-ratio:1;border-radius:8px;overflow:hidden;background:linear-gradient(160deg,#cfe1d8,#9cc0b2);position:relative;display:grid;place-items:end start}
.thumbs .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumbs .th span{position:relative;background:rgba(7,22,18,.72);color:#fff;font-size:12px;font-weight:600;padding:2px 7px;border-radius:0 6px 0 0}
.mini{list-style:none;margin:0;padding:0;font-size:14px}
.mini li{padding:7px 0;border-top:1px solid var(--line2)} .mini li:first-child{border-top:0}
.mini small{color:var(--ink2)}
.pw{font:700 26px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.06em;background:var(--sky);border:1px dashed var(--line);border-radius:8px;padding:12px;text-align:center;user-select:all;margin:8px 0 14px}

/* ---------- Tableau de bord en couleurs ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
@media (max-width:1180px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px 12px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--c)}
.tile .lbl{display:flex;align-items:center;gap:8px;color:var(--ink2);font-weight:600;font-size:14px}

<script>
"use strict";
/* ====================================================================
   Rivio · Garde-pêche — site d'administration local.
   Ce fichier reste sur ton PC : il n'est pas dans le dépôt GitHub.
   Il se connecte avec ton compte admin ; la base vérifie tes droits
   à chaque action. Aucune clé secrète ici : la clé ci-dessous est la
   clé publique de l'appli (la même que dans l'appli elle-même).
   ==================================================================== */
const _C=window.CDJ_CONFIG||{};
const CONFIG={ url:_C.SUPABASE_URL||"", key:_C.SUPABASE_KEY||"", legacyDomain:_C.EMAIL_DOMAIN||"coupdujour.app" };
const DEMO=/[?&]demo\b/.test(location.search);

const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null||v===false) continue;
    if(k==="class") e.className=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if(k==="html") e.innerHTML=v; else e.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
const svg=(d,vb="0 0 24 24")=>{ const s=document.createElementNS("http://www.w3.org/2000/svg","svg"); s.setAttribute("viewBox",vb); s.setAttribute("fill","none"); s.setAttribute("stroke","currentColor"); s.setAttribute("stroke-width","1.9"); s.setAttribute("stroke-linecap","round"); s.setAttribute("stroke-linejoin","round"); s.innerHTML=d; return s; };
const ICON={
  tableau:'<path d="M3 17c3-3 5-3 8 0s5 3 10-1"/><path d="M3 11c3-3 5-3 8 0s5 3 10-1"/><path d="M12 3v4"/>',
  membres:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.2c2.9.1 5 2.4 5 5.8"/>',
  moderation:'<path d="M12 3l7 3v5c0 5-3.2 8.4-7 10-3.8-1.6-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>',
  groupes:'<rect x="3" y="4" width="8" height="7" rx="1.5"/><rect x="13" y="4" width="8" height="7" rx="1.5"/><rect x="3" y="13" width="8" height="7" rx="1.5"/><rect x="13" y="13" width="8" height="7" rx="1.5"/>',
  contenu:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/>',
  maintenance:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',
  annonces:'<path d="M4 10v4h3l6 4V6L7 10z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/>',
  statistiques:'<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>',
  revenus:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5A4 4 0 1 0 15.5 15.5"/><path d="M6.5 10.5h6M6.5 13.5h6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'
};

/* ---------- Format ---------- */
const DF=new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"short",year:"numeric"});
const DTF=new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const fd=x=>x?DF.format(new Date(x)):"—";
const fdt=x=>x?DTF.format(new Date(x)):"—";
function ago(x){
  if(!x) return "jamais"; const s=(Date.now()-new Date(x))/1000;
  if(s<90) return "à l'instant"; if(s<3600) return "il y a "+Math.round(s/60)+" min";
  if(s<86400) return "il y a "+Math.round(s/3600)+" h"; const d=Math.round(s/86400);
  if(d===1) return "hier"; if(d<45) return "il y a "+d+" jours"; if(d<540) return "il y a "+Math.round(d/30)+" mois";
  return "il y a "+(d/365).toFixed(1).replace(".",",")+" ans";
}
function cronText(c){
  const p=String(c||"").trim().split(/\s+/); if(p.length!==5) return c;
  const [mi,ho,dm,mo,dw]=p; const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
  const hh=x=>{ const d=new Date(Date.UTC(2026,0,1,Number(x),Number(mi)||0)); return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); };
  if(c==="* * * * *") return "chaque minute";
  if(/^\*\/\d+$/.test(mi)&&ho==="*") return "toutes les "+mi.slice(2)+" min";
  if(/^\d+$/.test(mi)&&ho==="*") return "toutes les heures";
  if(/^\d+$/.test(mi)&&/^\*\/\d+$/.test(ho)) return "toutes les "+ho.slice(2)+" h";
  if(/^\d+$/.test(mi)&&/^\d+$/.test(ho)&&dm==="*"&&mo==="*"){ if(dw==="*") return "chaque jour à "+hh(ho); if(/^\d$/.test(dw)) return "le "+JOURS[Number(dw)%7]+" à "+hh(ho); }
  return c;
}
const pl=(n,one,many)=>n+" "+(n>1?(many||one+"s"):one);
function bytes(b){ if(b<1024) return b+" o"; if(b<1048576) return (b/1024).toFixed(0)+" Ko"; if(b<1073741824) return (b/1048576).toFixed(1).replace(".",",")+" Mo"; return (b/1073741824).toFixed(2).replace(".",",")+" Go"; }
const initial=u=>(u||"?").replace(/^@/,"").charAt(0).toUpperCase();
const COLORS=["#2c8b73","#1c6654","#e07a22","#5b7f9e","#8a6bb8","#b2432e","#3f7f4e"];
const colorOf=u=>{ let n=0; for(const c of String(u||"")) n=(n*31+c.charCodeAt(0))>>>0; return COLORS[n%COLORS.length]; };
function avatar(u,url){ const a=h("div",{class:"av",style:"background:"+colorOf(u)}); if(url) a.append(h("img",{src:url,alt:""})); else a.textContent=initial(u); return a; }
const ROLE={owner:"Responsable",mod:"Modérateur",member:"Membre"};
const KIND={post:"Prise",comment:"Commentaire",message:"Message du chat",dm:"Message privé"};

function toast(msg,err){ const t=$("#toast"); t.textContent=msg; t.className=err?"err":""; t.style.display="block"; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display="none",err?5200:2600); }
function frErr(e){ const m=(e&&(e.message||e.error_description))||String(e); if(/Invalid login/i.test(m)) return "Pseudo, e-mail ou mot de passe incorrect."; if(/JWT|session/i.test(m)) return "Ta session a expiré : reconnecte-toi."; return m; }

/* Petite boîte de dialogue : champs + bouton d'action */
function ask({title,text,fields=[],ok="Valider",danger=false,confirmWord}){
  return new Promise(res=>{
    const d=$("#dlg"); d.innerHTML="";
    const f=h("form",{method:"dialog"});
    f.append(h("h3",null,title)); if(text) f.append(h("p",null,text));
    const inputs={};
    fields.forEach(fl=>{
      let i;
      if(fl.type==="select"){ i=h("select",null,...fl.options.map(([v,t])=>h("option",{value:v},t))); }
      else if(fl.type==="textarea"){ i=h("textarea",{rows:3,maxlength:fl.max||300}); }
      else i=h("input",{type:fl.type||"text",maxlength:fl.max||300,placeholder:fl.placeholder||""});
      if(fl.value!=null) i.value=fl.value;
      inputs[fl.name]=i; f.append(h("label",{class:"field"},h("span",null,fl.label),i));
    });
    const go=h("button",{class:"btn "+(danger?"warn":"primary"),value:"ok"},ok);
    const no=h("button",{class:"btn",value:"no",type:"button",onclick:()=>{ d.close(); res(null); }},"Annuler");
    if(confirmWord){ go.disabled=true; const i=inputs.confirm; i.addEventListener("input",()=>go.disabled=i.value.trim()!==confirmWord); }
    f.append(h("div",{class:"acts"},no,go));
    f.addEventListener("submit",e=>{ e.preventDefault(); const out={}; for(const [k,i] of Object.entries(inputs)) out[k]=i.value.trim(); d.close(); res(out); });
    d.append(f); d.showModal(); (Object.values(inputs)[0]||go).focus();
  });
}

/* ====================================================================
   Accès aux données : la vraie base, ou un jeu d'exemple (?demo)
   ==================================================================== */
let sb=null, ME=null;
const API={};
async function rpc(name,args){ const {data,error}=await sb.rpc(name,args||{}); if(error) throw error; return data; }
async function q(p){ const {data,error}=await p; if(error) throw error; return data; }

API.real={
  async login(id,pw){ const email=id.includes("@")?id.toLowerCase():id.toLowerCase()+"@"+CONFIG.legacyDomain; const {error}=await sb.auth.signInWithPassword({email,password:pw}); if(error) throw error; },
  async me(){ const {data:{user}}=await sb.auth.getUser(); if(!user) return null; const p=await q(sb.from("profiles").select("id,username,is_admin").eq("id",user.id).maybeSingle()); return p; },
  logout:()=>sb.auth.signOut(),
  usage:()=>rpc("usage_stats"), health:()=>rpc("app_health"),
  members:()=>rpc("garde_members"), groups:()=>rpc("garde_groups"), storage:()=>rpc("garde_storage"),
  record:u=>rpc("member_record",{p_user:u}),
  async todo(){
    const [r,a,m,p,b]=await Promise.all([
      sb.from("reports").select("id",{count:"exact",head:true}).eq("status","open"),
      sb.from("sanction_appeals").select("id",{count:"exact",head:true}).eq("status","open"),
      sb.from("memberships").select("user_id",{count:"exact",head:true}).eq("status","pending"),
      sb.from("posts").select("id",{count:"exact",head:true}).eq("status","pending"),
      sb.from("bug_reports").select("id",{count:"exact",head:true}).eq("status","open")]);
    return {reports:r.count||0,appeals:a.count||0,members:m.count||0,posts:p.count||0,bugs:b.count||0};
  },
  reports:()=>q(sb.from("reports").select("id,group_id,user_id,kind,target_id,excerpt,author_id,reason,created_at,groups(name)").eq("status","open").order("created_at",{ascending:false}).limit(200)),
  closeReport:(id,st)=>q(sb.from("reports").update({status:st,handled_by:ME.id}).eq("id",id).eq("status","open").select("id")),
  deleteContent:(kind,id)=>q(sb.from({post:"posts",comment:"comments",message:"messages",dm:"direct_messages"}[kind]).delete().eq("id",id).select("id")),
  pendingPosts:()=>q(sb.from("posts").select("id,group_id,user_id,caption,species,length_cm,photo_path,photo_paths,created_at,groups(name)").eq("status","pending").order("created_at",{ascending:false}).limit(100)),
  approvePost:id=>rpc("approve_post",{p_id:id}),
  pendingMembers:()=>q(sb.from("memberships").select("group_id,user_id,joined_at,groups(name)").eq("status","pending").order("joined_at",{ascending:false}).limit(200)),
  approveMember:(g,u)=>rpc("approve_member",{p_group:g,p_user:u}),
  removeMember:(g,u)=>q(sb.from("memberships").delete().eq("group_id",g).eq("user_id",u).select("user_id")),
  appeals:()=>q(sb.from("sanction_appeals").select("id,timeout_id,user_id,message,status,created_at,moderation_timeouts(reason,ends_at,starts_at)").eq("status","open").order("created_at",{ascending:false})),
  answerAppeal:(id,ok,reply)=>rpc("respond_sanction_appeal",{p_id:id,p_accept:ok,p_reply:reply}),
  timeouts:()=>q(sb.from("moderation_timeouts").select("id,user_id,reason,starts_at,ends_at,created_by").is("lifted_at",null).gt("ends_at",new Date().toISOString()).order("ends_at")),
  journal:()=>q(sb.from("moderation_log").select("id,at,actor,action,target_user,group_id,details").order("at",{ascending:false}).limit(150)),
  warn:(u,r)=>rpc("warn_member",{p_user:u,p_reason:r}),
  timeout:(u,min,r)=>rpc("apply_timeout",{p_user:u,p_minutes:min,p_reason:r}),
  lift:(id,r)=>rpc("lift_timeout",{p_id:id,p_reason:r}),
  setController:(name,on)=>rpc("set_controller",{p_username:name,p_on:on}),
  groupMembers:g=>rpc("manage_members",{p_group:g}),
  setRole:(g,u,r)=>rpc("set_member_role",{p_group:g,p_user:u,p_role:r}),
  posts:g=>{ let x=sb.from("posts").select("id,group_id,user_id,caption,species,length_cm,weight_kg,photo_path,photo_paths,status,created_at,groups(name)").order("created_at",{ascending:false}).limit(60); if(g) x=x.eq("group_id",g); return q(x); },
  messages:g=>{ let x=sb.from("messages").select("id,group_id,user_id,body,photo_path,audio_path,created_at,groups(name)").order("created_at",{ascending:false}).limit(120); if(g) x=x.eq("group_id",g); return q(x); },
  spots:g=>{ let x=sb.from("spots").select("id,group_id,user_id,name,note,lat,lon,created_at,groups(name)").order("created_at",{ascending:false}).limit(200); if(g) x=x.eq("group_id",g); return q(x); },

  if(R.posts.length){ any=true; const l=h("ul",{class:"mini"}); R.posts.forEach(p=>l.append(h("li",null,h("b",null,hl(p.species||"Prise",t)),p.caption?[" : ",hl(p.caption,t)]:"",h("br"),h("small",null,memberName(p.user_id)+" dans "+(p.groups?.name||"?")+", "+ago(p.created_at))))); box.append(sec("Prises",R.posts.length,l)); }

  if(R.spots.length){ any=true; const l=h("ul",{class:"mini"}); R.spots.forEach(s=>l.append(h("li",null,h("b",null,hl(s.name,t)),h("small",null," "+(s.groups?.name||"")+", ajouté par "+memberName(s.user_id))))); box.append(sec("Spots",R.spots.length,l)); }
  if(!any) box.append(h("div",{class:"empty"},"Rien trouvé pour « "+t+" ». Les messages privés ne sont pas cherchés."));
  return box;
};

/* ---------- Mot de passe provisoire ---------- */
async function tempPasswordFlow(m){
  const ok=await ask({title:"Mot de passe provisoire pour "+m.username,text:"Son mot de passe actuel ne marchera plus. Tu lui transmets le provisoire, il se connecte avec, puis l'appli lui demande d'en choisir un nouveau.",ok:"Créer le mot de passe",danger:true});
  if(!ok) return;
  try{ const pw=await api.tempPassword(m.id);
    const d=$("#dlg"); d.innerHTML="";
    const copy=h("button",{class:"btn primary",type:"button",onclick:async()=>{ try{ await navigator.clipboard.writeText("Rivio : ton mot de passe provisoire est "+pw+" (connecte-toi avec ton e-mail ou ton pseudo, l'appli te demandera d'en choisir un nouveau)."); toast("Message copié"); }catch(e){ toast("Sélectionne le mot de passe pour le copier",1); } }},"Copier le message");
    d.append(h("form",{method:"dialog"},h("h3",null,"Mot de passe de "+m.username),h("p",null,"Il ne sera plus affiché après fermeture : envoie-le maintenant."),h("div",{class:"pw"},pw),h("div",{class:"acts"},h("button",{class:"btn",value:"close"},"Fermer"),copy)));
    d.showModal(); await ensureMembers(true);
  }catch(e){ toast(frErr(e),1); }
}

/* ---------- Fiche membre : prises, spots, messages ---------- */
async function memberExtras(m,b){
  const sec=h("section",{class:"panel"},h("h2",null,"Activité récente"),h("p",{class:"sub"},"Chargement…")); b.append(sec);
  try{
    const [P,S,Ms]=await Promise.all([api.memberPosts(m.id),api.memberSpots(m.id),api.memberMessages(m.id)]);
    const urls=await api.signed(P.map(p=>p.photo_path||(p.photo_paths||[])[0]));
    sec.innerHTML=""; sec.append(h("h2",null,"Activité récente"));
    if(P.length){ sec.append(h("h3",{style:"font:600 18px var(--f-d);margin:10px 0 6px"},"Dernières prises"),h("div",{class:"thumbs"},...P.map(p=>{ const u=urls[p.photo_path||(p.photo_paths||[])[0]]; return h("div",{class:"th",title:(p.species||"")+" "+(p.groups?.name||"")+", "+fd(p.created_at)},u?h("img",{src:u,alt:p.species||""}):null,h("span",null,(p.species||"Prise")+(p.length_cm?" "+p.length_cm+" cm":""))); }))); }
    if(S.length){ const l=h("ul",{class:"mini"}); S.forEach(s=>l.append(h("li",null,h("b",null,s.name),h("small",null," "+(s.groups?.name||"")+", "+fd(s.created_at)+" "),h("a",{href:"https://www.openstreetmap.org/?mlat="+s.lat+"&mlon="+s.lon+"#map=15/"+s.lat+"/"+s.lon,target:"_blank",rel:"noopener"},"carte")))); sec.append(h("h3",{style:"font:600 18px var(--f-d);margin:14px 0 4px"},"Spots"),l); }
    if(Ms.length){ const l=h("ul",{class:"mini"}); Ms.forEach(x=>l.append(h("li",null,x.body||(x.audio_path?"Message vocal":x.photo_path?"Photo":""),h("br"),h("small",null,(x.groups?.name||"")+", "+ago(x.created_at))))); sec.append(h("h3",{style:"font:600 18px var(--f-d);margin:14px 0 4px"},"Messages récents"),l); }
    if(!P.length&&!S.length&&!Ms.length) sec.append(h("p",{class:"muted"},"Rien publié pour l'instant."));
  }catch(e){ sec.innerHTML=""; sec.append(h("h2",null,"Activité récente"),h("p",{class:"muted"},frErr(e))); }
}

/* ---------- Thème et alertes sur le PC ---------- */
function drawTheme(){ const d=document.documentElement.dataset.theme==="dark"; $("#theme-btn").textContent=d?"Passer en thème clair":"Passer en thème sombre"; }
$("#theme-btn")?.addEventListener("click",()=>{ const d=document.documentElement.dataset.theme==="dark"?"light":"dark"; document.documentElement.dataset.theme=d; try{ localStorage.setItem("garde-theme",d); }catch(e){} drawTheme(); route(); });
const ALERT={last:null,on:false};
try{ ALERT.on=localStorage.getItem("garde-alerts")!=="off"; }catch(e){ ALERT.on=true; }
function drawAlertBtn(){ const p=("Notification" in window)?Notification.permission:"denied"; $("#alert-btn").textContent=!ALERT.on?"Activer les alertes":p==="granted"?"Couper les alertes":"Alertes sur le bureau"; }
$("#alert-btn")?.addEventListener("click",async()=>{
  if(ALERT.on&&"Notification" in window&&Notification.permission==="default"){ try{ await Notification.requestPermission(); }catch(e){} drawAlertBtn(); return; }
  ALERT.on=!ALERT.on; try{ localStorage.setItem("garde-alerts",ALERT.on?"on":"off"); }catch(e){} drawAlertBtn(); toast(ALERT.on?"Alertes activées":"Alertes coupées");
});
function beep(){ try{ const c=new (window.AudioContext||window.webkitAudioContext)(); const o=c.createOscillator(), g=c.createGain(); o.frequency.value=880; g.gain.setValueAtTime(.12,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+.5); }catch(e){} }
function setTitle(n){ document.title=(n?"("+n+") ":"")+"Rivio · Garde-pêche"; }
async function watchTodo(){
  try{ const t=await api.todo(); const total=t.reports+t.appeals+t.members+t.posts+t.bugs; setTitle(t.reports+t.appeals+t.members+t.posts);
    if(ALERT.last&&ALERT.on){ const news=[]; if(t.reports>ALERT.last.reports) news.push(pl(t.reports-ALERT.last.reports,"nouveau signalement","nouveaux signalements"));
      if(t.appeals>ALERT.last.appeals) news.push(pl(t.appeals-ALERT.last.appeals,"nouveau recours","nouveaux recours"));
      if(t.members>ALERT.last.members) news.push(pl(t.members-ALERT.last.members,"demande d'adhésion","demandes d'adhésion"));
      if(t.posts>ALERT.last.posts) news.push(pl(t.posts-ALERT.last.posts,"prise à valider","prises à valider"));
      if(t.bugs>ALERT.last.bugs) news.push(pl(t.bugs-ALERT.last.bugs,"bug signalé","bugs signalés"));
      if(news.length){ const msg=news.join(", "); toast("🔔 "+msg); beep();
        if("Notification" in window&&Notification.permission==="granted"){ try{ const n=new Notification("Rivio · Garde-pêche",{body:msg,icon:document.querySelector("link[rel=icon]")?.href}); n.onclick=()=>{ window.focus(); location.hash=t.bugs>ALERT.last?.bugs&&!t.reports?"#maintenance":"#moderation"; }; }catch(e){} } } }
    ALERT.last=t; TODO=t; drawNav(); void total;
  }catch(e){}
}

/* ====================================================================
   Démarrage
   ==================================================================== */
async function start(){
  if(!DEMO){
    if(!window.supabase){ document.body.innerHTML='<div class="empty" style="margin:40px">Pas de connexion Internet : le site a besoin d\'Internet pour joindre la base Rivio.</div>'; return; }
    sb=window.supabase.createClient(CONFIG.url,CONFIG.key,{auth:{persistSession:true,storageKey:"rivio-garde-peche"}});
  }
  ME=(DEMO&&/login/.test(location.search))?null:await api.me().catch(()=>null);
  if(!ME){ $("#login").hidden=false; $("#app").hidden=true; return; }
  if(!ME.is_admin){ await api.logout(); $("#login").hidden=false; $("#l-err").textContent="Ce compte n'est pas administrateur."; return; }
  $("#login").hidden=true; $("#app").hidden=false; $("#me-name").textContent=ME.username;
  drawTheme(); drawAlertBtn(); refreshTodo(); route();
  watchTodo(); clearInterval(start.t); start.t=setInterval(watchTodo,60000);
}
$("#login-form").addEventListener("submit",async e=>{
  e.preventDefault(); const b=$("#l-go"); b.disabled=true; $("#l-err").textContent="";
  try{ await api.login($("#l-id").value.trim(),$("#l-pw").value); $("#l-pw").value=""; await start(); }
  catch(er){ $("#l-err").textContent=frErr(er); }
  b.disabled=false;
});
$("#logout").addEventListener("click",async()=>{ await api.logout(); location.hash=""; location.reload(); });
$("#gsearch").addEventListener("submit",e=>{ e.preventDefault(); const v=$("#gsearch-q").value.trim(); if(v) location.hash="#recherche/"+encodeURIComponent(v); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") $("#drawer").classList.remove("open"); });
start();
</script>
